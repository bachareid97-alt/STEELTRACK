<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SteelTrack (Web) — Login</title>
    <style>
      body{font-family:Inter, system-ui, Arial; background:#0a0e17;color:#e6ebf5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
      .card{background:#0f1524;padding:28px;border-radius:12px;width:420px}
      input{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #1e293b;background:#0b1220;color:#e6ebf5}
      button{margin-top:12px;padding:10px 14px;border-radius:8px;background:#f0883e;border:none;color:#1a1206;font-weight:700;cursor:pointer}
      .kv{margin-top:18px}
      .kv input{width:70%;display:inline-block}
      .kv button{display:inline-block;width:28%;margin-left:4%}
      pre{background:#071022;padding:10px;border-radius:8px;overflow:auto}
    </style>
  </head>
  <body>
    <div class="card">
      <h2>SteelTrack — Sign in</h2>
      <div>
        <label>Username</label>
        <input id="username" value="admin" />
      </div>
      <div>
        <label>Password</label>
        <input id="password" type="password" />
      </div>
      <button id="btnLogin">Sign in</button>

      <div id="appArea" style="display:none">
        <h3>Simple KV UI</h3>
        <div class="kv">
          <input id="kvKey" placeholder="key" />
          <input id="kvValue" placeholder="value" />
          <button id="btnSet">Set</button>
        </div>
        <div style="margin-top:12px">
          <button id="btnReload">Reload store</button>
        </div>
        <h4>Current store</h4>
        <pre id="store"></pre>
      </div>
    </div>
    <script src="/static/main.js"></script>
  </body>
</html>
